services:
  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend.dockerfile
    container_name: agrisight-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${WEB_PORT:-8000}
      - backend
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: ./docker/backend.dockerfile
    container_name: agrisight-backend
    ports:
      - "${WEB_PORT}:8000"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - app-network

  postgres:
    image: postgres:13
    container_name: agrisight-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: agrisight-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network

  worker:
    build:
      context: .
      dockerfile: ./docker/backend.dockerfile
    container_name: agrisight-celery
    depends_on:
      - redis
      - backend
    working_dir: /backend
    env_file:
      - .env
    networks:
      - app-network

  inference:
    build:
      context: .
      dockerfile: ./docker/inference.dockerfile
    container_name: agrisight_inference
    ports:
      - "8001:8000" 
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
